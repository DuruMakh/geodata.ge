version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # eslint-config-next 16 bundles an eslint-plugin-react that crashes on ESLint 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # Types track the Node 24 runtime (engines, CI, deploy); bump them with the runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
