name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  checks:
    name: Lint, typecheck, tests, data, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run data:validate
      # Deliberately NOT --omit=dev. The data pipeline's file parsers (xlsx,
      # pdf-parse) are devDependencies, and the data:validate step above runs
      # them over official workbooks and PDFs inside this job — so scoping the
      # audit to production dependencies exempted exactly the code that reads
      # outside files. `xlsx` is installed from the SheetJS CDN (see
      # package.json): the npm registry copy is abandoned at 0.18.5 and carries
      # two unpatchable high advisories.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://fiscal.ge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
