name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/web

jobs:
  checks:
    name: Lint, typecheck, tests, data, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run data:validate
      # The e2e job also builds, inside Playwright's webServer. This runs the
      # build directly so a build failure reports as a build failure instead of
      # as a webServer timeout, and so the job name above stays true.
      - run: npm run build
      # Deliberately NOT --omit=dev. The data pipeline's file parsers (xlsx,
      # pdf-parse) are devDependencies, and the data:validate step above runs
      # them over official workbooks and PDFs inside this job — so scoping the
      # audit to production dependencies exempted exactly the code that reads
      # outside files. `xlsx` is installed from the SheetJS CDN (see
      # package.json): the npm registry copy is abandoned at 0.18.5 and carries
      # two unpatchable high advisories.
      - name: Audit dependencies
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=high --fetch-retries=0 --fetch-timeout=30000; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "npm audit failed; retrying after a short delay (attempt $attempt of 3)."
              sleep 10
            fi
          done
          exit 1
      # Nothing in this job may write into the repository. `git status --porcelain`
      # respects .gitignore, so the generated output under public/downloads/ and
      # data/reports/ stays invisible here — but unlike `git diff` it also reports
      # NEW files and staged changes, which is the case this guard exists for: a
      # test or script creating a file under a tracked, non-ignored path.
      # `always()` on purpose: a failing step is exactly when a test is most
      # likely to have left the tree dirty (an aborted tamper/restore), so the
      # guard has to run even then or it reports nothing in the case it is for.
      - name: Fail if the job wrote into the repository
        if: always()
        working-directory: ${{ github.workspace }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "The checks job modified the repository:"
            git status --porcelain
            exit 1
          fi

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SITE_URL: https://fiscal.ge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
