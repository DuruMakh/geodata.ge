name: Deploy production

# The single road to production. Vercel auto-deploy for main is disabled in
# apps/web/vercel.json, so production only updates when this workflow succeeds:
# CI green on main (its build job builds the same static export) -> POST the
# Vercel deploy hook, and Vercel builds latest main from the reviewed CSVs.
# Until 2026-11 this workflow also migrated, imported and built from a Supabase
# mirror; that mirror is retired (spec docs/superpowers/specs/
# 2026-11-04-static-export-and-supabase-retirement-design.md).

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    # workflow_run also fires when CI fails; deploy only after green CI —
    # and only for push-triggered CI runs: a fork PR's CI run can carry
    # head_branch == main, so admitting pull_request-sourced runs would let
    # outside PRs trigger production deploys. workflow_dispatch is the
    # manual escape hatch (reruns, rollout, deploying past a flaky check),
    # and only from main: a dispatch runs the workflow file from the chosen
    # branch with the deploy hook secret.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Nothing to check out: the hook makes Vercel build latest main itself.
    steps:
      # Not proof the deploy LANDED: Vercel builds asynchronously after
      # accepting the hook. Closing that gap needs a VERCEL_TOKEN secret to
      # poll GET /v13/deployments/{id} — see the runbook note in
      # docs/deployment.md.
      - name: Trigger Vercel production build
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          response="$(curl -fsS --retry 3 --max-time 60 -X POST "$VERCEL_DEPLOY_HOOK_URL")"
          # -f covers the HTTP status; this covers a 2xx whose body is not the
          # job envelope the hook is documented to return.
          job_id="$(printf '%s' "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{process.stdout.write(JSON.parse(s)?.job?.id??"")}catch{}})')"
          if [ -z "$job_id" ]; then
            echo "Deploy hook returned no job id; body was: $response" >&2
            exit 1
          fi
          echo "Vercel deploy job: $job_id"
